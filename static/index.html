<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">智学助手</h1>
                <p class="subtitle">课程知识库问答与出题智能体</p>
                <button id="btn-new-course" class="btn btn-primary">＋ 新建课程</button>
            </div>
            <ul id="course-list" class="course-list">
                <li class="course-empty">暂无课程，点击上方按钮新建</li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main">
            <div class="tabs">
                <button class="tab active" data-tab="documents">文档管理</button>
                <button class="tab" data-tab="chat">智能问答</button>
                <button class="tab" data-tab="quiz">自动出题</button>
                <button class="tab" data-tab="mistakes">错题本</button>
            </div>

            <section id="tab-documents" class="tab-panel active">
                <div class="panel-header">
                    <h2>文档管理</h2>
                    <span class="current-course">当前课程：<strong id="current-course-name">未选择</strong></span>
                </div>
                <div class="panel-toolbar">
                    <button id="btn-upload" class="btn btn-primary btn-sm">上传文档</button>
                    <input type="file" id="file-input" accept=".pdf,.docx,.doc,.md,.txt" hidden>
                </div>
                <div id="upload-status" class="upload-status" hidden></div>
                <ul id="document-list" class="document-list">
                    <li class="doc-empty">请先在左侧选择课程</li>
                </ul>
            </section>

            <section id="tab-chat" class="tab-panel">
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <div class="chat-hint">请先在左侧选择课程，然后在下方输入问题</div>
                    </div>
                    <div class="chat-input-bar">
                        <input type="text" id="chat-input" class="chat-input" placeholder="请输入你的问题，回车发送">
                        <button id="btn-send" class="btn btn-primary">发送</button>
                    </div>
                </div>
            </section>

            <section id="tab-quiz" class="tab-panel">
                <div class="panel-header">
                    <h2>自动出题</h2>
                    <span class="current-course">当前课程：<strong id="quiz-current-course">未选择</strong></span>
                </div>
                <div class="quiz-form">
                    <div class="form-group">
                        <label for="quiz-type">题型</label>
                        <select id="quiz-type">
                            <option value="single">单选</option>
                            <option value="multiple">多选</option>
                            <option value="judge">判断</option>
                            <option value="short">简答</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quiz-difficulty">难度</label>
                        <select id="quiz-difficulty">
                            <option value="easy">易</option>
                            <option value="medium" selected>中</option>
                            <option value="hard">难</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quiz-count">数量</label>
                        <select id="quiz-count">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4</option>
                            <option selected>5</option>
                            <option>6</option>
                            <option>7</option>
                            <option>8</option>
                            <option>9</option>
                            <option>10</option>
                        </select>
                    </div>
                    <button id="btn-generate-quiz" class="btn btn-primary">生成题目</button>
                </div>
                <div id="quiz-status" class="upload-status" hidden></div>
                <div id="quiz-list" class="quiz-list">
                    <div class="quiz-empty">请先在左侧选择课程，再生成题目</div>
                </div>
            </section>

            <section id="tab-mistakes" class="tab-panel">
                <div class="panel-header">
                    <h2>错题本</h2>
                    <span class="current-course">当前课程：<strong id="mistake-current-course">未选择</strong></span>
                </div>
                <div id="mistake-list" class="mistake-list">
                    <div class="quiz-empty">请先在左侧选择课程</div>
                </div>
            </section>
        </main>
    </div>

    <!-- 新建课程弹窗 -->
    <div id="course-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h3 class="modal-title">新建课程</h3>
            <label class="modal-label" for="input-course-name">课程名称</label>
            <input type="text" id="input-course-name" class="modal-input" placeholder="请输入课程名称">
            <label class="modal-label" for="input-course-desc">课程描述（可选）</label>
            <textarea id="input-course-desc" class="modal-input" rows="3" placeholder="请输入课程描述"></textarea>
            <div class="modal-actions">
                <button id="btn-modal-cancel" class="btn btn-secondary">取消</button>
                <button id="btn-modal-confirm" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
