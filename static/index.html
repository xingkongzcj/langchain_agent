<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学助手</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">智学助手</h1>
                <p class="subtitle">课程知识库问答与出题智能体</p>
                <button id="btn-new-course" class="btn btn-primary">＋ 新建课程</button>
            </div>
            <ul id="course-list" class="course-list">
                <li class="course-empty">暂无课程，点击上方按钮新建</li>
            </ul>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main">
            <div class="tabs">
                <button class="tab active" data-tab="documents">文档管理</button>
                <button class="tab" data-tab="chat">智能问答</button>
            </div>

            <section id="tab-documents" class="tab-panel active">
                <div class="panel-header">
                    <h2>文档管理</h2>
                    <span class="current-course">当前课程：<strong id="current-course-name">未选择</strong></span>
                </div>
                <div class="panel-toolbar">
                    <button id="btn-upload" class="btn btn-primary btn-sm">上传文档</button>
                    <input type="file" id="file-input" accept=".pdf,.docx,.doc,.md,.txt" hidden>
                </div>
                <div id="upload-status" class="upload-status" hidden></div>
                <ul id="document-list" class="document-list">
                    <li class="doc-empty">请先在左侧选择课程</li>
                </ul>
            </section>

            <section id="tab-chat" class="tab-panel">
                <h2>智能问答</h2>
                <p class="placeholder">基于课程知识库的 RAG 问答功能开发中…</p>
            </section>
        </main>
    </div>

    <!-- 新建课程弹窗 -->
    <div id="course-modal" class="modal-overlay" hidden>
        <div class="modal">
            <h3 class="modal-title">新建课程</h3>
            <label class="modal-label" for="input-course-name">课程名称</label>
            <input type="text" id="input-course-name" class="modal-input" placeholder="请输入课程名称">
            <label class="modal-label" for="input-course-desc">课程描述（可选）</label>
            <textarea id="input-course-desc" class="modal-input" rows="3" placeholder="请输入课程描述"></textarea>
            <div class="modal-actions">
                <button id="btn-modal-cancel" class="btn btn-secondary">取消</button>
                <button id="btn-modal-confirm" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
