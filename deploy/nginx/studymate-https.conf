# 智学助手 - HTTPS 站点（备案通过、证书签好后启用）
# 部署位置：/etc/nginx/sites-available/studymate-https.conf
# 注意：本文件监听 8443，由 443 的 SNI 分流（stream-split.conf）转发进来，
#       这样 443 可以同时承载「HTTPS 站点」和「SSH-over-TLS 隧道」。
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name xingkongzcj.cloud www.xingkongzcj.cloud;

    ssl_certificate     /etc/letsencrypt/live/xingkongzcj.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xingkongzcj.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# 备案通过后，把 80 的访问 301 到 https（替换 studymate.conf 或加在这里）
server {
    listen 80;
    listen [::]:80;
    server_name xingkongzcj.cloud www.xingkongzcj.cloud;
    return 301 https://$host$request_uri;
}
