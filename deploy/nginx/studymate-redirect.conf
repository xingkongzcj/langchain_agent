# 80 → https 跳转（备案通过、443 分流启用后使用）
# 部署位置：/etc/nginx/sites-available/studymate-redirect.conf
# 启用前请先禁用 studymate.conf，否则两个 80 站点会冲突。
#
# 注意：跳转写在 location / 里，而不是 server 级 return，
#       这样 certbot 续期时插入的 /.well-known/acme-challenge/ location 才能优先匹配。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xingkongzcj.cloud www.xingkongzcj.cloud _;

    location / {
        return 301 https://$host$request_uri;
    }
}
