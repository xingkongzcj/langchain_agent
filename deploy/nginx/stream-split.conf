# 443 端口按 SNI 分流（自包含 stream 块，可追加到 /etc/nginx/nginx.conf 主配置层）
#
# 作用：同一个 443 上同时提供
#   1) https://xingkongzcj.cloud  → 127.0.0.1:8443（站点）
#   2) 其它 / 无 SNI             → 127.0.0.1:4430（stunnel → 本机 22，SSH 通道）
#
# 注意：map 里必须写 IP:端口，不能写 upstream 组名——
#       用变量做 proxy_pass 时组名不会被解析，连接会被直接关闭（已踩坑）。

stream {
    map $ssl_preread_server_name $studymate_backend {
        xingkongzcj.cloud      127.0.0.1:8443;
        www.xingkongzcj.cloud  127.0.0.1:8443;
        default                127.0.0.1:4430;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $studymate_backend;
        proxy_timeout 1h;
    }
}
