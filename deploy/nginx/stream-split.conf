# 443 端口按 SNI 分流（备案通过后启用）
# 部署位置：/etc/nginx/modules-enabled/ 之外，放到 http 配置块之外
# 注意：stream 块必须写在 /etc/nginx/nginx.conf 的主配置层（不能在 http{} 里）。
#
# 作用：同一个 443 上同时提供
#   1) https://xingkongzcj.cloud  → nginx 8443（站点）
#   2) 其它 / 无 SNI             → 127.0.0.1:4430（stunnel → 本机 22，SSH 通道）
# 这样校园网封锁 SSH 时仍可 ssh，同时网站也能用标准 443。

map $ssl_preread_server_name $studymate_backend {
    xingkongzcj.cloud       web;
    www.xingkongzcj.cloud   web;
    default                 ssh;
}

upstream studymate_web {
    server 127.0.0.1:8443;
}

upstream studymate_ssh {
    server 127.0.0.1:4430;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $studymate_backend;
    proxy_timeout 1h;
}
