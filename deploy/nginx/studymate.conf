# 智学助手 - HTTP 站点（备案通过前使用，直接反代到应用）
# 部署位置：/etc/nginx/sites-available/studymate.conf
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xingkongzcj.cloud www.xingkongzcj.cloud _;

    # 应用侧限制单文件 20MB，这里留点余量给 multipart 边界
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # 静态资源走浏览器缓存
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 出题/评分可能跑几十秒，超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
